# Gitleaks configuration for LENR_SIM_APP.
# Extends the built-in default ruleset; only documented false positives are
# allowlisted here. Run locally with:  gitleaks git --redact -v .

title = "LENR_SIM_APP gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented false positives (reviewed 2026-09)"
regexTarget = "line"
regexes = [
  # BibTeX-style citation keys in the literature datasets
  # (e.g. "citation_key": "fleischmann1989") trip the generic-api-key rule.
  '''"citation_key":\s*"[A-Za-z0-9_\-]+"''',
  # hCaptcha public site keys are public by design (legacy saved HTML page).
  '''data-sitekey="[0-9a-f\-]{36}"''',
]
paths = [
  # Legacy v1 tree lives only in history (see tag archive/pre-legacy-removal).
  '''^LENR_SIM_APP_v1/''',
  # Lockfiles contain integrity hashes, never secrets.
  '''(^|/)package-lock\.json$''',
]
