notes: "Displaced-oscillator linear-coupling Poisson tail is a labelled model assumption. Step ratio S/(N+1) < 1 for N >= S, so the tail is strictly decreasing; the integer bound -7.0e5 on log10 P_N at S = 1e4 is conservative (Python lgamma gives ~ -7.66e5 at N = 5.75e5 and ~ -2.5e9 at N = 5.75e8). S_min ~ N (relaxation energy ~ Q) is the honest requirement. Does not close EQ-OPEN-RAD-01 or EQ-OPEN-MEV-01."
