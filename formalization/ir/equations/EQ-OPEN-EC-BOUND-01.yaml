notes: "BOUNDED / form-DISPROVEN under AX caps (EQ-CM-BUDGET-01 10-100 eV/atom; double-layer band 0.1-1 eV); never CLOSED. Proves per-atom electrostatic / thermal reservoirs cannot satisfy q4ElectronCaptureSourceClosed, and that the Q4 predicate itself is not refuted outright (q4_not_refuted_outright), so EQ-OPEN-EC-01 stays OPEN. Does not address Widom-Larsen mass renormalization (EQ-WL-MASS-01, SPEC) or other collective concentration channels; closing would need k >= 7820 per-atom budgets concentrated onto one capture plus governed evidence. Cavitation / collapse hydro is orthogonal and not an input. condensedMatterPathToThreshold and lenrProved stay false (ec_bounds_keep_honesty_locks)."
