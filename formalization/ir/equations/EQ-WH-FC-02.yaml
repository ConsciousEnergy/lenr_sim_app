notes: "Universalises EQ-WH-FC-01 over the licensed S grid and every N >= 300048 via a halving lemma (step S/(n+1) <= 1/2 once n >= 2S), and derives the EQ-WH-FC-01 literals (fcDerivedRatio = 0, gamma branching 1000 milli, log10 P_N <= -7e5 cap) instead of asserting them. Envelope corollary: at N = 5.75e8 the bound holds for S <= 2^23 (relaxation <= ~0.35 MeV); Python lgamma puts S_min near 0.9998 N. Only unmechanized step: e^{-S} <= 1. Model class: single displaced oscillator, linear coupling; anharmonic / Umklapp / lossy spin-boson are outside it. harmonic_dos_non_closure is the paper §5A.2 alias. BOUNDED / class-DISPROVEN only; does not close EQ-OPEN-RAD-01."
