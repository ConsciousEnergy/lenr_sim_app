notes: "BOUNDED, not CLOSED: EQ-OPEN-MEV-01 stays OPEN. Under engine caps (phonon <= ceil(Q*1e-3) from the EQ-WH-FC-01 weight floor, gamma <= ceil(Q*BR_gamma), recoil = 0) every licensed allocation leaves remainder >= R_min (23776 keV at the engine default BR_gamma = 0; > 0 for BR_gamma <= 0.998). Zeroing the remainder within caps forces BR_gamma >= 0.999, which fails Q2 against any detector bound < 0.999. Collapse / ENC hydro claims allocate 0 keV of the MeV nuclear remainder. No phonon-nuclear matrix element or occupation probability is supplied."
