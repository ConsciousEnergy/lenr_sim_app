notes: "Honesty gap, not closure. Engine caps do NOT certify non-closure for the 25 pm TSC trap or for three-body with ULM mass renormalization: engine defaults already give log10 N ~ +9.7 / +7.1 over the paper window, driven by the unconstrained 25 pm separation, f_nuc = 1, and m*/m_e = 4. These scenario budgets are not nuclear-rate proofs (EQ-BBL-NR-01: scenario priors / hydro compression are not lab constraints). Certifying non-closure at 25 pm would need P_occ f_nuc C_lin E_enh <= 1e-23 from experiment. EQ-OPEN-RATE-01 stays OPEN."
