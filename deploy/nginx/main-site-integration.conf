# LENR Sim App Integration with conscious.energy Main Site
# 
# Add this configuration to your main site's nginx server block
# to proxy requests to /lenr-sim-app to the containerized application.
#
# IMPORTANT: This file should be included in your main nginx configuration
# that serves conscious.energy, NOT used standalone.

# Upstream definition - add this outside of server block if not already present
# Adjust the port if you changed it in docker-compose.yml
upstream lenr_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Add these location blocks inside your server block for conscious.energy
# ---------------------------------------------------------------------

# Proxy all /lenr-sim-app requests to the containerized application
location /lenr-sim-app {
    proxy_pass http://lenr_app;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    
    # WebSocket support (for real-time visualization)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts for long-running physics calculations
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    
    # Buffering
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
}

