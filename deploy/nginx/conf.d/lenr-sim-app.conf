# LENR Simulation App - Server Configuration
# Proxies /lenr-sim-app to frontend and backend services

upstream frontend {
    server frontend:80;
    keepalive 32;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Client body size for file uploads
    client_max_body_size 50M;

    # Root location (redirect to main site if accessed directly)
    location = / {
        return 301 /lenr-sim-app/;
    }

    # Frontend static files - React SPA
    location /lenr-sim-app {
        alias /usr/share/nginx/html/lenr-sim-app;
        
        # Try files, fallback to index.html for SPA routing
        try_files $uri $uri/ /lenr-sim-app/index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Don't cache HTML files
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        
        # Rate limiting for general requests
        limit_req zone=general_limit burst=50 nodelay;
    }

    # Backend API proxy
    location /lenr-sim-app/api/ {
        # Rewrite to remove the /lenr-sim-app prefix before proxying
        rewrite ^/lenr-sim-app/api/(.*)$ /api/$1 break;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        # Headers for proper proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /lenr-sim-app;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for long-running physics calculations
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Rate limiting for API
        limit_req zone=api_limit burst=20 nodelay;
    }

    # WebSocket endpoint for real-time visualization
    location /lenr-sim-app/api/visualization/ws/ {
        rewrite ^/lenr-sim-app/api/(.*)$ /api/$1 break;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Required for WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Longer timeouts for WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # API Documentation
    location /lenr-sim-app/api/docs {
        rewrite ^/lenr-sim-app/api/(.*)$ /api/$1 break;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /lenr-sim-app/health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
