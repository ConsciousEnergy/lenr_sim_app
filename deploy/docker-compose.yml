# LENR Simulation App - Docker Compose Configuration
# For deployment at conscious.energy/lenr-sim-app

version: '3.8'

services:
  # Frontend Service
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        PUBLIC_URL: /lenr-sim-app
        REACT_APP_API_BASE_URL: https://conscious.energy/lenr-sim-app/api
        VITE_API_URL: https://conscious.energy/lenr-sim-app/api
    container_name: lenr-frontend
    restart: unless-stopped
    networks:
      - lenr-network
    depends_on:
      - backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Backend Service  
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: lenr-backend
    restart: unless-stopped
    environment:
      - LENR_ENVIRONMENT=production
      - LENR_DEBUG=false
      - LENR_CORS_ORIGINS=https://conscious.energy,https://www.conscious.energy
      - LENR_LOG_LEVEL=INFO
      - LENR_ENABLE_RATE_LIMITING=true
      - LENR_RATE_LIMIT_PER_MINUTE=60
      - LENR_ENABLE_SECURE_HEADERS=true
      - LENR_ENABLE_HSTS=true
      - LENR_DEFAULT_TIMEOUT=60.0
    volumes:
      - backend-logs:/app/logs
      - backend-static:/app/static
    networks:
      - lenr-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Nginx Reverse Proxy (integrates with main site)
  nginx:
    image: nginx:alpine
    container_name: lenr-nginx
    restart: unless-stopped
    ports:
      - "8080:80"  # Internal port - main nginx will proxy to this
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lenr-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  lenr-network:
    driver: bridge

volumes:
  backend-logs:
  backend-static:
