# Alembic Configuration for LENR Simulation App
# v0.2.3-beta

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend date to migration file names
prepend_date = True

# Timezone for migration file timestamps
timezone = UTC

# sys.path prepending - migrations will need to import models
prepend_sys_path = .

# Version table name
version_table = alembic_version

# Version table schema (default is None)
version_table_schema =

# Version locations (for branch support)
version_locations = %(here)s/alembic/versions

# Truncate revision in message filenames
truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision --autogenerate'
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
sourceless = false

# Version path separator (use 'os' for os.pathsep)
version_path_separator = os

# Output encoding
output_encoding = utf-8

# SQLAlchemy URL - will be overridden in env.py
# For local development with SQLite:
sqlalchemy.url = sqlite+aiosqlite:///./data/lenr_sim.db


[post_write_hooks]
# Post write hooks (optional formatting)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
