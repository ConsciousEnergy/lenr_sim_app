[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Display settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test collection/execution
markers =
    unit: marks a test as a unit test
    integration: marks a test as an integration test
    physics: marks a test for physics calculations
    api: marks a test for API functionality
    performance: marks a test for performance benchmarking
    slow: marks tests that are expected to be slow
    visualization: marks tests for visualization components
    simulation_debug: end-to-end simulation + physics-engine debug smoke suite

# Coverage settings
addopts = --cov=app --cov-report=term-missing --cov-report=html --cov-config=tests/.coveragerc 