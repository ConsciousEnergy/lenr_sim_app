# Conscious Energy — child repository registry (Goal 1)
# Consumed by humans and future release tooling. Keep YAML additive.

version: 1
updated: "2026-10-04"
owner_org: ConsciousEnergy

repos:
  - id: umlenr-hub
    github: ConsciousEnergy/UMLENR
    role: program_hub
    visibility: public
    trust_plane: docs
    notes: "Umbrella docs, schemas, registries, release manifests"

  - id: lenr-sim
    github: ConsciousEnergy/lenr_sim_app
    role: public_simulation
    visibility: public
    trust_plane: runtime
    infra_reference: true
    live_compose_url: "https://lenr-sim-beta.conscious.energy"
    notes: "Reference Swarm/Ansible/Traefik/Terraform/Cloudflare stack"

  - id: lenr-ara
    github: null  # early/private LENR_ARA; org path in operator registry only
    role: private_daq
    visibility: private
    trust_plane: daq
    notes: "Low-cost DAQ; never co-tenant with lenr-ci or public Sim DB; schemas only via hub"

  - id: project-proteus
    github: null  # refresh after hub baseline
    role: research_refresh
    visibility: mixed
    trust_plane: docs
    notes: "Align release manifests with hub after Goal 1 lands"

  - id: conscious-energy-site
    github: null  # Astro front end TBD
    role: marketing_site
    visibility: public
    trust_plane: pages
    notes: "WP.com CMS → Astro on Cloudflare Pages; apex phase-1 stays WP.com"

hosts:
