# Grafana unified alert rules (PromQL via Prometheus datasource uid=prometheus).
# Firing visible in UI over SSH tunnel; email when SMTP is enabled.
apiVersion: 1

groups:
  - orgId: 1
    name: lenr_swarm_critical
    folder: LENR-Sim
    interval: 1m
    rules:
      - uid: lenr_api_health_down
        title: LenrApiHealthDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min(probe_success{job=~"lenr_backend_health|lenr_api_staging_public"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              settings: { mode: "" }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: LENR API health probe failed (overlay and/or api-staging)
          description: probe_success dropped below 1 for job lenr_backend_health or lenr_api_staging_public.
        labels:
          severity: critical
          team: lenr-ops
        isPaused: false

      - uid: lenr_share_probe_down
        title: LenrShareProbeDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_success{job="lenr_share_public"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Compose share / cutover host public health probe failed
          description: https://lenr-sim-beta.conscious.energy/api/health probe_success != 1
        labels:
          severity: warning
          team: lenr-ops
        isPaused: false

      - uid: lenr_traefik_scrape_down
        title: LenrTraefikScrapeDown
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="traefik"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: Traefik Prometheus scrape is down
        labels:
          severity: critical
          team: lenr-ops
        isPaused: false

      - uid: lenr_traefik_5xx_high
        title: LenrTraefik5xxHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: gt, params: [0.5] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: Traefik 5xx rate elevated (>0.5/s for 5m)
        labels:
          severity: warning
          team: lenr-ops
        isPaused: false

      - uid: lenr_node_disk_low
        title: LenrNodeDiskLow
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: min(node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: lt, params: [0.15] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: Root filesystem free space below 15%
        labels:
          severity: warning
          team: lenr-ops
        isPaused: false

      - uid: lenr_node_exporter_missing
        title: LenrNodeExporterMissing
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: count(up{job="node"} == 1) or vector(0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              conditions:
                - evaluator: { type: lt, params: [1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: No node_exporter targets are up (expect >=1 staging; >=2 after multi-node cutover)
        labels:
          severity: critical
          team: lenr-ops
        isPaused: false
