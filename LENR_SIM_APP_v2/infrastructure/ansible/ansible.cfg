# Ansible Configuration for LENR Simulation App

[defaults]
inventory = inventory.yml
# host_key_checking is enabled by default for security
# For local/dev testing, use: ANSIBLE_HOST_KEY_CHECKING=False environment variable
retry_files_enabled = False
stdout_callback = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts
fact_caching_timeout = 3600

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Use default known_hosts file for security (prevents MITM attacks)
# For local/dev testing, use: ANSIBLE_SSH_ARGS="-o UserKnownHostsFile=/dev/null"
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes
pipelining = True
control_path_dir = ~/.ansible/cp

[colors]
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
