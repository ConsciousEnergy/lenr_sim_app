---
# LENR Simulation App - Database Backup Playbook

- name: Backup PostgreSQL Database
  hosts: all
  become: true
  vars:
    backup_dir: /opt/lenr-sim/backups
    timestamp: "{{ ansible_date_time.epoch }}"
    
  tasks:
    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0700'
        owner: root
        group: root
        
    - name: Find PostgreSQL container
      ansible.builtin.shell: |
        docker ps -q -f name=lenr-sim_postgres
      register: postgres_container
      changed_when: false
      
    - name: Create database backup
      ansible.builtin.shell: |
        set -o pipefail
        umask 077
        docker exec {{ postgres_container.stdout | quote }} \
          pg_dump -U {{ postgres_user | default('lenr_app') | quote }} {{ postgres_db | default('lenr_sim') | quote }} | \
          gzip > {{ backup_dir }}/lenr_sim_{{ timestamp }}.sql.gz
      args:
        executable: /bin/bash
      when: postgres_container.stdout is defined and postgres_container.stdout != ""
      register: backup_result
      
    - name: Set secure permissions on backup file
      ansible.builtin.file:
        path: "{{ backup_dir }}/lenr_sim_{{ timestamp }}.sql.gz"
        mode: '0600'
        owner: root
        group: root
      when: >
        backup_result is defined
        and backup_result is not skipped
        and (backup_result.rc | default(1)) == 0
      
    - name: Clean up old backups
      ansible.builtin.find:
        paths: "{{ backup_dir }}"
        patterns: "*.sql.gz"
        age: "{{ backup_retention_days | default(7) }}d"
      register: old_backups
      
    - name: Remove old backup files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.matched > 0
      
    - name: List recent backups
      ansible.builtin.shell: |
        ls -lh {{ backup_dir }}/*.sql.gz 2>/dev/null | tail -5 || true
      register: backup_list
      changed_when: false
      failed_when: false
      
    - name: Display backup information
      ansible.builtin.debug:
        msg: |
          {% if backup_result is defined and backup_result.rc == 0 %}
          Backup complete!
          
          Recent backups:
          {{ backup_list.stdout if backup_list.stdout else 'No backups found' }}
          
          Backup location: {{ backup_dir }}
          {% else %}
          Backup skipped or failed. Check logs for details.
          Backup location: {{ backup_dir }}
          {% endif %}
