---
# Join Swarm workers and apply node labels (app / observability).
#
# Label contract — separate keys (Swarm allows one value per key):
#   app=true            → API replica placement when require_app_label=true
#   observability=true  → Prometheus/Grafana/blackbox when require_observability_label=true
#   postgres=true       → external Compose DB volume pin (share manager only)
#
# Inventory host vars:
#   swarm_node_labels:
#     - app=true
#     - observability=true
#
# Compatible with:
#   - inventory.staging.yml (children: swarm_managers / swarm_workers)
#   - flat inventory.yml (all hosts) — labels only; no worker join
#
# Diagram SOT: docs/v0.3.8-beta/THREE_NODE_SWARM_TOPOLOGY.md
# Do not target CI KVM2 (45.93.100.251) or live Compose share without cutover plan.

- name: Collect Swarm worker join token from managers
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Decide if this host is a Swarm manager for this play
      ansible.builtin.set_fact:
        _is_swarm_manager: >-
          {{
            true if ((groups['swarm_managers'] | default([])) | length == 0)
            else (inventory_hostname in groups['swarm_managers'])
          }}

    - name: Ensure manager is an active Swarm node
      ansible.builtin.command: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
      register: manager_swarm_state
      changed_when: false
      when: _is_swarm_manager | bool

    - name: Fail if manager is not in an active Swarm
      ansible.builtin.fail:
        msg: >-
          Manager {{ inventory_hostname }} Swarm state is
          '{{ manager_swarm_state.stdout }}'. Run setup-docker.yml first.
      when:
        - _is_swarm_manager | bool
        - manager_swarm_state.stdout is defined
        - manager_swarm_state.stdout != "active"

    - name: Get worker join token
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_join_token
      changed_when: false
      when: _is_swarm_manager | bool
      run_once: true

    - name: Get manager advertise address for join
      ansible.builtin.command: docker info --format '{% raw %}{{.Swarm.NodeAddr}}{% endraw %}'
      register: manager_advertise_addr
      changed_when: false
      when: _is_swarm_manager | bool
      run_once: true

    - name: Cache join facts on managers
      ansible.builtin.set_fact:
        swarm_worker_join_token: "{{ worker_join_token.stdout }}"
        swarm_manager_addr: "{{ manager_advertise_addr.stdout }}"
      when:
        - _is_swarm_manager | bool
        - worker_join_token.stdout is defined
        - manager_advertise_addr.stdout is defined

- name: Join worker nodes to Swarm
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Decide if this host is a Swarm worker
      ansible.builtin.set_fact:
        _is_swarm_worker: "{{ inventory_hostname in (groups['swarm_workers'] | default([])) }}"

    - name: Check local Swarm state
      ansible.builtin.command: docker info --format '{% raw %}{{.Swarm.LocalNodeState}}{% endraw %}'
      register: worker_swarm_state
      changed_when: false
      when: _is_swarm_worker | bool

    - name: Resolve join token from first manager
      ansible.builtin.set_fact:
        _join_token: "{{ hostvars[_mgr]['swarm_worker_join_token'] | default('') }}"
        _join_addr: "{{ hostvars[_mgr]['swarm_manager_addr'] | default('') }}"
      vars:
        _mgr: "{{ (groups['swarm_managers'] | default([groups['all'][0]]))[0] }}"
      when: _is_swarm_worker | bool

    - name: Join Swarm as worker
      ansible.builtin.command: >-
        docker swarm join
        --token {{ _join_token }}
        {{ _join_addr }}:2377
      when:
        - _is_swarm_worker | bool
        - worker_swarm_state.stdout is defined
        - worker_swarm_state.stdout != "active"
        - _join_token | default('') | length > 0
        - _join_addr | default('') | length > 0
      register: worker_join_result
      failed_when: >
        worker_join_result.rc is defined and worker_join_result.rc != 0 and
        ("already part of a swarm" not in (worker_join_result.stderr | default("")))

    - name: Report worker Swarm state
      ansible.builtin.debug:
        msg: "Worker {{ inventory_hostname }} Swarm state={{ worker_swarm_state.stdout }}"
      when:
        - _is_swarm_worker | bool
        - worker_swarm_state.stdout is defined

- name: Apply node labels from inventory (on a manager)
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Decide if this host should run label updates
      ansible.builtin.set_fact:
        _is_swarm_manager: >-
          {{
            true if ((groups['swarm_managers'] | default([])) | length == 0)
            else (inventory_hostname in groups['swarm_managers'])
          }}

    - name: Apply swarm_node_labels for each inventory host
      ansible.builtin.shell: |
        set -euo pipefail
        TARGET_NAME="{{ item }}"
        TARGET_IP="{{ hostvars[item].get('ansible_host', '') }}"
        TARGET_ADV="{{ hostvars[item].get('swarm_advertise_addr', '') }}"
        NODE_ID="$(docker node ls -q | while read -r id; do
          host="$(docker node inspect "$id" --format '{% raw %}{{.Description.Hostname}}{% endraw %}')"
          addr="$(docker node inspect "$id" --format '{% raw %}{{.Status.Addr}}{% endraw %}')"
          if [ "$host" = "$TARGET_NAME" ] \
            || { [ -n "$TARGET_IP" ] && [ "$addr" = "$TARGET_IP" ]; } \
            || { [ -n "$TARGET_ADV" ] && [ "$addr" = "$TARGET_ADV" ]; }; then
            echo "$id"
            break
          fi
        done)"
        if [ -z "$NODE_ID" ]; then
          echo "ERROR: could not resolve Swarm node for $TARGET_NAME (ip=$TARGET_IP adv=$TARGET_ADV) — labels required" >&2
          docker node ls >&2 || true
          exit 1
        fi
        {% for label in hostvars[item].get('swarm_node_labels', []) %}
        docker node update --label-add {{ label | quote }} "$NODE_ID"
        {% endfor %}
        echo "Labeled $NODE_ID ($TARGET_NAME): {{ hostvars[item].get('swarm_node_labels', []) | join(' ') }}"
      args:
        executable: /bin/bash
      loop: "{{ groups['all'] }}"
      when:
        - _is_swarm_manager | bool
        - hostvars[item].get('swarm_node_labels', []) | length > 0
      run_once: true
      register: label_result
      changed_when: "'Labeled' in (label_result.results | default([]) | map(attribute='stdout', default='') | join('\n'))"
      # Inventory hostname (e.g. share-manager-1) often ≠ Docker Hostname (srv…).
      # Match also uses ansible_host IP against node Status.Addr — fail hard if neither hits.
      failed_when: >
        (label_result.results | default([]) | selectattr('rc', 'defined')
         | selectattr('rc', 'ne', 0) | list | length) > 0

    - name: Show current node labels
      ansible.builtin.shell: |
        docker node ls -q | while read -r id; do
          docker node inspect "$id" --format '{% raw %}{{.Description.Hostname}} {{json .Spec.Labels}}{% endraw %}'
        done
      args:
        executable: /bin/bash
      register: node_labels_dump
      changed_when: false
      when: _is_swarm_manager | bool
      run_once: true

    - name: Print node labels
      ansible.builtin.debug:
        msg: "{{ node_labels_dump.stdout_lines }}"
      when:
        - _is_swarm_manager | bool
        - node_labels_dump.stdout_lines is defined
      run_once: true

    - name: Collect required label keys from inventory
      ansible.builtin.set_fact:
        _required_label_keys: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | map(attribute='swarm_node_labels', default=[])
            | flatten
            | map('regex_replace', '=.*$', '')
            | unique
            | list
          }}
      when: _is_swarm_manager | bool
      run_once: true

    - name: Assert each required label key exists on at least one Swarm node
      ansible.builtin.shell: |
        set -euo pipefail
        dump="$(docker node ls -q | while read -r id; do
          docker node inspect "$id" --format '{% raw %}{{json .Spec.Labels}}{% endraw %}'
        done)"
        missing=0
        for key in {{ _required_label_keys | join(' ') }}; do
          if ! echo "$dump" | grep -q "\"${key}\""; then
            echo "ERROR: no Swarm node has label key '${key}'" >&2
            missing=1
          else
            echo "OK label key present: ${key}"
          fi
        done
        exit "$missing"
      args:
        executable: /bin/bash
      when:
        - _is_swarm_manager | bool
        - (_required_label_keys | default([]) | length) > 0
      run_once: true
      changed_when: false
