---
# LENR Simulation App - Deploy Docker Stack Playbook
# Deploys the application stack to Docker Swarm

- name: Deploy LENR Simulation App Stack
  hosts: all
  become: true
  vars:
    stack_name: lenr-sim
    # Defaults live in group_vars/all.yml + inventory — do not self-reference here
    # (Ansible recursive loop on app_domain / traefik_acme_email).
    
  tasks:
    - name: Apply deploy defaults when inventory omitted them
      ansible.builtin.set_fact:
        app_domain: "{{ app_domain | default('conscious.energy', true) }}"
        api_subdomain: "{{ api_subdomain | default('api', true) }}"
        traefik_acme_email: "{{ traefik_acme_email | default('diadon@conscious.energy', true) }}"

    # Flat inventories (no swarm_managers group): every host is treated as manager.
    # Multi-node prod: stack/secret ops run only on swarm_managers; workers still
    # receive bind-mount dirs + observability scaffolds for placement constraints.
    - name: Decide if this host is a Swarm manager for stack ops
      ansible.builtin.set_fact:
        _is_swarm_manager: >-
          {{
            true if ((groups['swarm_managers'] | default([])) | length == 0)
            else (inventory_hostname in groups['swarm_managers'])
          }}

    # ==========================================================================
    # Pre-deployment Validation
    # ==========================================================================
    
    - name: Verify Docker Swarm is active
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: swarm_status
      changed_when: false
      failed_when: swarm_status.stdout != "active"
      
    - name: Check if stack is already deployed
      ansible.builtin.command: docker stack ls --format '{{ "{{.Name}}" }}'
      register: existing_stacks
      changed_when: false
      when: _is_swarm_manager | bool
      
    # ==========================================================================
    # Create Required Directories
    # ==========================================================================
    
    - name: Ensure application directory exists
      ansible.builtin.file:
        path: /opt/lenr-sim
        state: directory
        mode: '0755'
        owner: root
        group: root
        
    - name: Ensure Traefik directory exists
      ansible.builtin.file:
        path: /opt/lenr-sim/traefik
        state: directory
        mode: '0755'
        owner: root
        group: root

    # ACME storage bind-mount target. setup-docker.yml also creates this, but
    # cutover / redeploy may run deploy-stack alone — Traefik refuses to start
    # (or loses certs) if /certs is missing or acme.json is world-readable.
    - name: Ensure Traefik ACME certs directory exists
      ansible.builtin.file:
        path: /opt/lenr-sim/traefik/certs
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Stat Traefik acme.json
      ansible.builtin.stat:
        path: /opt/lenr-sim/traefik/certs/acme.json
      register: traefik_acme_json

    # Traefik expects a JSON object store. A zero-byte touch leaves an invalid
    # file; seed "{}" only when missing or empty so we never wipe live certs.
    - name: Seed Traefik acme.json when missing or zero-length
      ansible.builtin.copy:
        dest: /opt/lenr-sim/traefik/certs/acme.json
        content: "{}"
        mode: '0600'
        owner: root
        group: root
      when: >-
        (not traefik_acme_json.stat.exists)
        or ((traefik_acme_json.stat.size | default(0) | int) == 0)

    - name: Ensure Traefik acme.json mode is restrictive
      ansible.builtin.file:
        path: /opt/lenr-sim/traefik/certs/acme.json
        state: file
        mode: '0600'
        owner: root
        group: root
        modification_time: preserve
        access_time: preserve

    # Backend runs as uid/gid 1000 (appuser); bind mounts must be writable.
    - name: Ensure backend bind-mount dirs are writable by appuser
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "1000"
        group: "1000"
      loop:
        - /opt/lenr-sim/logs
        - /opt/lenr-sim/data
    
    # ==========================================================================
    # Copy Stack Files
    # ==========================================================================
    
    - name: Copy Docker stack file
      ansible.builtin.template:
        src: ../templates/docker-stack.yml.j2
        dest: /opt/lenr-sim/docker-stack.yml
        mode: '0644'
        
    - name: Ensure Traefik dynamic config directory exists
      ansible.builtin.file:
        path: /opt/lenr-sim/traefik/dynamic
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Copy Traefik static configuration
      ansible.builtin.template:
        src: ../templates/traefik.yml.j2
        dest: /opt/lenr-sim/traefik/traefik.yml
        mode: '0644'
        
    - name: Create Traefik dynamic configuration
      ansible.builtin.template:
        src: ../templates/traefik-dynamic.yml.j2
        dest: /opt/lenr-sim/traefik/dynamic/dynamic.yml
        mode: '0644'

    # ==========================================================================
    # Observability configs (Prometheus + Grafana provisioning)
    # ==========================================================================

    - name: Ensure observability directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - /opt/lenr-sim/observability
        - /opt/lenr-sim/observability/prometheus
        - /opt/lenr-sim/observability/grafana
      when: observability_enabled | default(true)

    - name: Sync observability scaffolds to host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../observability/"
        dest: /opt/lenr-sim/observability/
        mode: '0644'
        directory_mode: '0755'
      when: observability_enabled | default(true)

    # Host-mode Grafana publish binds 0.0.0.0 and bypasses UFW. Drop non-lo :3000
    # in DOCKER-USER so only ssh -L / localhost can reach the login page.
    - name: Install Grafana localhost-only DOCKER-USER guard
      ansible.builtin.copy:
        dest: /etc/systemd/system/lenr-grafana-localhost.service
        mode: '0644'
        content: |
          [Unit]
          Description=Drop non-localhost Docker publishes to Grafana :3000
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c 'iptables -C DOCKER-USER -p tcp --dport {{ grafana_publish_host_port | int }} ! -i lo -j DROP 2>/dev/null || iptables -I DOCKER-USER 1 -p tcp --dport {{ grafana_publish_host_port | int }} ! -i lo -j DROP'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      when:
        - observability_enabled | default(true)
        - (grafana_publish_host_port | default(0) | int) > 0

    - name: Enable Grafana localhost-only DOCKER-USER guard
      ansible.builtin.systemd:
        name: lenr-grafana-localhost.service
        enabled: true
        state: started
        daemon_reload: true
      when:
        - observability_enabled | default(true)
        - (grafana_publish_host_port | default(0) | int) > 0
        
    # ==========================================================================
    # Create Docker Secrets (managers only)
    # ==========================================================================
    
    - name: Check if postgres_password secret exists
      ansible.builtin.command: docker secret ls --format '{{ "{{.Name}}" }}'
      register: existing_secrets
      changed_when: false
      when: _is_swarm_manager | bool

    - name: Refuse random DB password when reusing Compose volume
      ansible.builtin.assert:
        that:
          - >-
            ('postgres_password' in (existing_secrets.stdout | default('')))
            or (postgres_password is defined and (postgres_password | length) > 0)
        fail_msg: >-
          postgres_volume_external requires an existing docker secret
          postgres_password (import LENR_DB_PASSWORD from Compose .env) or
          -e postgres_password=... matching the volume. Refusing to mint a
          random password that would break the DB.
      when:
        - _is_swarm_manager | bool
        - postgres_volume_external | default(false)
    
    - name: Generate PostgreSQL password if not set (fresh stacks only)
      ansible.builtin.set_fact:
        postgres_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when:
        - _is_swarm_manager | bool
        - postgres_password is not defined
        - not (postgres_volume_external | default(false))
        - "'postgres_password' not in (existing_secrets.stdout | default(''))"
      
    - name: Create PostgreSQL password secret
      ansible.builtin.command:
        cmd: docker secret create postgres_password -
        stdin: "{{ postgres_password }}"
      when:
        - _is_swarm_manager | bool
        - "'postgres_password' not in (existing_secrets.stdout | default(''))"
        - postgres_password is defined
      no_log: true
      
    - name: Generate API secret key if not set
      ansible.builtin.set_fact:
        api_secret_key: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
      when:
        - _is_swarm_manager | bool
        - api_secret_key is not defined
        - "'api_secret_key' not in (existing_secrets.stdout | default(''))"
      no_log: true
      
    - name: Create API secret key secret
      ansible.builtin.command:
        cmd: docker secret create api_secret_key -
        stdin: "{{ api_secret_key }}"
      when:
        - _is_swarm_manager | bool
        - "'api_secret_key' not in (existing_secrets.stdout | default(''))"
        - api_secret_key is defined
      no_log: true

    - name: Generate Grafana admin password if not set (observability stacks)
      ansible.builtin.set_fact:
        grafana_admin_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when:
        - _is_swarm_manager | bool
        - observability_enabled | default(true)
        - grafana_admin_password is not defined
        - "'grafana_admin_password' not in (existing_secrets.stdout | default(''))"
      no_log: true

    - name: Create Grafana admin password secret
      ansible.builtin.command:
        cmd: docker secret create grafana_admin_password -
        stdin: "{{ grafana_admin_password }}"
      when:
        - _is_swarm_manager | bool
        - observability_enabled | default(true)
        - "'grafana_admin_password' not in (existing_secrets.stdout | default(''))"
        - grafana_admin_password is defined
      no_log: true

    # SMTP password for Grafana unified alerting email. Only when
    # grafana_smtp_enabled=true — never commit the value; mint via vault / -e
    # or let this task generate once and persist as Swarm secret.
    - name: Generate Grafana SMTP password if SMTP enabled and secret missing
      ansible.builtin.set_fact:
        grafana_smtp_password: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      when:
        - _is_swarm_manager | bool
        - observability_enabled | default(true)
        - grafana_smtp_enabled | default(false)
        - grafana_smtp_password is not defined
        - "'grafana_smtp_password' not in (existing_secrets.stdout | default(''))"
      no_log: true

    - name: Create Grafana SMTP password secret
      ansible.builtin.command:
        cmd: docker secret create grafana_smtp_password -
        stdin: "{{ grafana_smtp_password }}"
      when:
        - _is_swarm_manager | bool
        - observability_enabled | default(true)
        - grafana_smtp_enabled | default(false)
        - "'grafana_smtp_password' not in (existing_secrets.stdout | default(''))"
        - grafana_smtp_password is defined
      no_log: true

    - name: Fail when SMTP enabled but secret still missing
      ansible.builtin.assert:
        that:
          - "'grafana_smtp_password' in (existing_secrets.stdout | default('')) or grafana_smtp_password is defined"
        fail_msg: >-
          grafana_smtp_enabled=true but grafana_smtp_password Swarm secret is
          missing. Pass -e grafana_smtp_password=... (vault) or remove the
          enable flag until the secret is minted.
      when:
        - _is_swarm_manager | bool
        - observability_enabled | default(true)
        - grafana_smtp_enabled | default(false)
      
    # ==========================================================================
    # GHCR login + stack deploy (managers only)
    # ==========================================================================

    - name: Decide whether GHCR login is required
      ansible.builtin.set_fact:
        _skip_ghcr_login: "{{ (skip_ghcr_login | default(false)) | bool }}"
        _have_ghcr: >-
          {{
            (ghcr_username | default('') | length > 0) and
            (ghcr_token | default('') | length > 0)
          }}
      when: _is_swarm_manager | bool

    - name: Require GHCR credentials unless skip_ghcr_login (local images)
      ansible.builtin.assert:
        that:
          - _skip_ghcr_login or _have_ghcr
        fail_msg: >-
          Set ghcr_username + ghcr_token (Ansible Vault or env via
          --extra-vars) before deploy-stack.yml, or pass
          -e skip_ghcr_login=true after loading images locally.
          Prep docs: docs/v0.3.8-beta/SWARM_PAGES_CUTOVER_PREP.md
      when: _is_swarm_manager | bool

    - name: Log in to GitHub Container Registry
      ansible.builtin.shell: |
        echo "{{ ghcr_token }}" | docker login ghcr.io -u "{{ ghcr_username }}" --password-stdin
      no_log: true
      changed_when: false
      when:
        - _is_swarm_manager | bool
        - _have_ghcr | bool

    - name: Deploy Docker stack (with registry auth)
      ansible.builtin.command: >
        docker stack deploy
        --compose-file /opt/lenr-sim/docker-stack.yml
        --with-registry-auth
        {{ stack_name }}
      register: deploy_result
      when:
        - _is_swarm_manager | bool
        - _have_ghcr | bool

    - name: Deploy Docker stack (local images, no registry auth)
      ansible.builtin.command: >
        docker stack deploy
        --compose-file /opt/lenr-sim/docker-stack.yml
        --resolve-image never
        {{ stack_name }}
      register: deploy_result_local
      when:
        - _is_swarm_manager | bool
        - not (_have_ghcr | bool)
      
    - name: Wait for services to start
      ansible.builtin.shell: |
        set -eu
        bad=0
        while read -r reps; do
          [ -n "$reps" ] || continue
          cur="${reps%%/*}"
          want="${reps##*/}"
          if [ "$cur" != "$want" ]; then
            bad=1
          fi
        done <<< "$(docker stack services {{ stack_name }} --format '{{ "{{.Replicas}}" }}')"
        exit "$bad"
      args:
        executable: /bin/bash
      register: services_status
      until: services_status.rc == 0
      retries: 36
      delay: 10
      changed_when: false
      when: _is_swarm_manager | bool
      
    # ==========================================================================
    # Verification (managers only)
    # ==========================================================================
    
    - name: Get stack services status
      ansible.builtin.command: docker stack services {{ stack_name }}
      register: stack_services
      changed_when: false
      when: _is_swarm_manager | bool
      
    - name: Print deployment summary
      ansible.builtin.debug:
        msg: |
          Deployment Complete!
          
          Stack: {{ stack_name }}
          Domain: {{ app_domain }}
          API URL: https://{{ api_subdomain }}.{{ app_domain }}
          
          Services:
          {{ stack_services.stdout }}
          
          Next steps:
          1. Verify DNS records point to this server
          2. Wait for Let's Encrypt certificates
          3. Test API endpoints
      when: _is_swarm_manager | bool
          
    # ==========================================================================
    # Optional: Backup Database
    # ==========================================================================
    
    - name: Ensure logs directory exists (appuser uid 1000 — keep writable)
      ansible.builtin.file:
        path: /opt/lenr-sim/logs
        state: directory
        mode: '0755'
        owner: "1000"
        group: "1000"
        
    - name: Create backup script
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # LENR Sim Database Backup Script
          set -euo pipefail
          
          BACKUP_DIR="/opt/lenr-sim/backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Create backup directory if it doesn't exist
          mkdir -p "$BACKUP_DIR"
          
          # Find postgres container
          CONTAINER=$(docker ps -q -f name={{ stack_name }}_postgres)
          
          if [ -z "$CONTAINER" ]; then
            echo "Error: PostgreSQL container not found" >&2
            exit 1
          fi
          
          # Create backup with error checking
          TEMP_FILE="${BACKUP_DIR}/lenr_sim_${TIMESTAMP}.sql.gz.tmp"
          if ! docker exec "$CONTAINER" pg_dump -U {{ postgres_user | default('lenr_app') }} {{ postgres_db | default('lenr_sim') }} | gzip > "$TEMP_FILE"; then
            echo "Error: pg_dump or gzip failed" >&2
            rm -f "$TEMP_FILE"
            exit 1
          fi
          
          # Only move temp file to final location on success
          mv "$TEMP_FILE" "${BACKUP_DIR}/lenr_sim_${TIMESTAMP}.sql.gz"
          
          # Keep only last 7 days of backups
          find "$BACKUP_DIR" -name "*.sql.gz" -mtime +7 -delete || true
          
          echo "Backup created: ${BACKUP_DIR}/lenr_sim_${TIMESTAMP}.sql.gz"
        dest: /opt/lenr-sim/backup.sh
        mode: '0755'
      when: _is_swarm_manager | bool
        
    - name: Setup daily backup cron job
      ansible.builtin.cron:
        name: "LENR Sim Database Backup"
        minute: "0"
        hour: "3"
        job: "/opt/lenr-sim/backup.sh >> /opt/lenr-sim/logs/backup.log 2>&1"
      when: _is_swarm_manager | bool
