---
# LENR Simulation App - Master Playbook
# Runs all configuration playbooks in order

- name: Complete LENR Sim Server Setup
  hosts: all
  become: false
  tasks:
    - name: Show deployment info
      ansible.builtin.debug:
        msg: |
          ==========================================
          LENR Simulation App Deployment
          Environment: {{ environment | default('prod') }}
          Domain: {{ app_domain }}
          ==========================================

- import_playbook: setup-docker.yml

- import_playbook: deploy-stack.yml
