---
# LENR Simulation App - Docker + Swarm Setup Playbook
# Installs Docker, configures Swarm mode, and prepares for deployment

# Install Docker on every inventory host. Swarm *init* runs only on managers
# (group swarm_managers when present; otherwise hosts: all for flat inventories).
# Worker join + labels: playbooks/join-workers.yml

- name: Setup Docker and Docker Swarm
  hosts: all
  become: true
  vars:
    docker_users:
      - root
    # Init only on managers — workers join via join-workers.yml.
    # Flat inventories (no swarm_managers group): init on every host (single-node).
    swarm_init: >-
      {{
        true if ((groups['swarm_managers'] | default([])) | length == 0)
        else (inventory_hostname in groups['swarm_managers'])
      }}
    
  tasks:
    # ==========================================================================
    # Pre-flight Checks
    # ==========================================================================
    
    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_precheck
      changed_when: false
      failed_when: false

    - name: Wait for post-install marker when Docker is not yet installed
      ansible.builtin.wait_for:
        path: /root/.lenr-sim-postinstall-complete
        state: present
        timeout: 300
      when: docker_precheck.rc != 0

    - name: Record skip of post-install wait (Docker already present)
      ansible.builtin.debug:
        msg: >-
          Docker already available ({{ docker_precheck.stdout | default('ok') }});
          skipping wait for /root/.lenr-sim-postinstall-complete
      when: docker_precheck.rc == 0
      
    - name: Gather facts
      ansible.builtin.setup:
        
    - name: Print OS information
      ansible.builtin.debug:
        msg: "Running on {{ ansible_distribution }} {{ ansible_distribution_version }}"
        
    # ==========================================================================
    # Docker Installation (skip when Docker already present — e.g. prebaked KVM1)
    # ==========================================================================

    - name: Remove old Docker packages
      ansible.builtin.apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
      when: docker_precheck.rc != 0
        
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present
        update_cache: true
      when: docker_precheck.rc != 0

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: docker_precheck.rc != 0
        
    - name: Add Docker GPG key (signed-by keyring; apt-key removed on Ubuntu 24+)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: docker_precheck.rc != 0
        
    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker
      when: docker_precheck.rc != 0
        
    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: docker_precheck.rc != 0
        
    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        
    # ==========================================================================
    # Docker System Configuration
    # ==========================================================================
    
    - name: Create Docker daemon configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'
        
    - name: Configure Docker daemon
      ansible.builtin.copy:
        # NOTE: live-restore is incompatible with Swarm mode — do not enable.
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            },
            "default-ulimits": {
              "nofile": {
                "Name": "nofile",
                "Hard": 65536,
                "Soft": 65536
              }
            },
            "metrics-addr": "127.0.0.1:9323"
          }
        dest: /etc/docker/daemon.json
        mode: '0644'
      notify: Restart Docker
      
    - name: Flush handlers to apply Docker config
      ansible.builtin.meta: flush_handlers
        
    - name: Add users to docker group
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: docker_users | length > 0
      failed_when: false
      
    # ==========================================================================
    # Docker Swarm Initialization
    # ==========================================================================

    - name: Resolve Swarm advertise address (prefer inventory ansible_host)
      ansible.builtin.set_fact:
        _swarm_advertise_addr: "{{ swarm_advertise_addr | default(ansible_host) | default(ansible_default_ipv4.address) }}"
    
    - name: Check if Swarm is already initialized
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: swarm_status
      changed_when: false

    - name: Allow Swarm TCP ports in UFW (multi-node join)
      ansible.builtin.command: ufw allow {{ item }}/tcp comment 'Docker Swarm'
      loop: "{{ ufw_swarm_ports_tcp | default([2377, 7946]) }}"
      register: ufw_tcp
      changed_when: "'Skipping' not in (ufw_tcp.stdout | default(''))"
      failed_when: false

    - name: Allow Swarm UDP ports in UFW (gossip / overlay)
      ansible.builtin.command: ufw allow {{ item }}/udp comment 'Docker Swarm'
      loop: "{{ ufw_swarm_ports_udp | default([7946, 4789]) }}"
      register: ufw_udp
      changed_when: "'Skipping' not in (ufw_udp.stdout | default(''))"
      failed_when: false
      
    - name: Initialize Docker Swarm (managers only)
      ansible.builtin.command: >-
        docker swarm init --advertise-addr {{ _swarm_advertise_addr }}
      when: 
        - swarm_init | bool
        - swarm_status.stdout != "active"
        - (_swarm_advertise_addr | string | length) > 0
      register: swarm_init_result
      failed_when: >
        swarm_init_result.rc != 0 and
        ("already part of a swarm" not in swarm_init_result.stderr | default("") and
         "already part of a swarm" not in swarm_init_result.stdout | default(""))

    - name: Skip Swarm init on workers (joined by join-workers.yml)
      ansible.builtin.debug:
        msg: "Skipping swarm init on {{ inventory_hostname }} (not in swarm_managers); use join-workers.yml"
      when: not (swarm_init | bool)

    # Re-check after init: pre-init swarm_status is stale when we just joined/created.
    - name: Re-check Swarm state after init (managers)
      ansible.builtin.command: docker info --format '{{ "{{.Swarm.LocalNodeState}}" }}'
      register: swarm_status_after
      changed_when: false
      when: swarm_init | bool

    - name: Fail if manager Swarm is not active after init
      ansible.builtin.fail:
        msg: >-
          Manager {{ inventory_hostname }} Swarm state is
          '{{ swarm_status_after.stdout | default("unknown") }}'
          (advertise-addr={{ _swarm_advertise_addr }}).
          Fix UFW/advertise-addr and re-run setup-docker.yml.
      when:
        - swarm_init | bool
        - (swarm_status_after.stdout | default("")) != "active"
      
    # ==========================================================================
    # Prepare Application Directories
    # ==========================================================================
    
    - name: Create application directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /opt/lenr-sim
        - /opt/lenr-sim/data
        - /opt/lenr-sim/logs
        - /opt/lenr-sim/backups
        - /opt/lenr-sim/traefik
        - /opt/lenr-sim/traefik/certs
        - /opt/lenr-sim/observability
        - /opt/lenr-sim/observability/prometheus
        - /opt/lenr-sim/observability/grafana
        - /opt/lenr-sim/observability/grafana/provisioning
        
    - name: Set secure permissions on Traefik certs directory
      ansible.builtin.file:
        path: /opt/lenr-sim/traefik/certs
        state: directory
        mode: '0700'
        owner: root
        group: root
        
    - name: Create Docker network for the application
      # Prefer CLI: community.docker can fail on newer Docker Engine URL schemes.
      # Gate on post-init swarm_status_after so overlay is created on first init
      # (pre-init swarm_status is still inactive and "is changed" can miss
      # already-part-of-swarm / skipped edge cases).
      ansible.builtin.command: >
        docker network create
        --driver overlay
        --attachable
        --scope swarm
        lenr-sim-network
      register: overlay_create
      changed_when: overlay_create.rc == 0
      failed_when: >
        overlay_create.rc != 0 and
        ("already exists" not in (overlay_create.stderr | default("")))
      when:
        - swarm_init | bool
        - (swarm_status_after.stdout | default("")) == "active"
      
    # ==========================================================================
    # System Tuning
    # ==========================================================================
    
    - name: Set sysctl parameters for Docker
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: 'vm.max_map_count', value: '262144' }
        - { name: 'net.core.somaxconn', value: '65535' }
        - { name: 'net.ipv4.ip_forward', value: '1' }
        
    # ==========================================================================
    # Verification
    # ==========================================================================
    
    - name: Verify Docker installation
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false
      
    - name: Verify Docker Compose installation
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false
      
    - name: Print installation summary
      ansible.builtin.debug:
        msg: |
          Docker Installation Complete!
          
          Docker: {{ docker_version.stdout }}
          Compose: {{ compose_version.stdout }}
          Swarm Status: {{ swarm_status.stdout }}
          Server IP: {{ ansible_default_ipv4.address }}
          
          Next steps:
          1. Run deploy-stack.yml to deploy the application
          2. Configure DNS to point to this server
          
  handlers:
    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
