# LENR Simulation App - Ansible Group Variables
# Shared variables for all hosts

# Application settings
app_name: lenr-sim
# Swarm image tags (bump with the four version surfaces for a release cutover).
app_version: "0.3.9-beta"
backend_image_tag: "{{ app_version }}"
frontend_image_tag: "{{ app_version }}"
swarm_frontend_enabled: false
frontend_replicas: 2
app_domain: "conscious.energy"
api_subdomain: "api"

# Docker settings
docker_compose_version: "2.24.5"
docker_users:
  - deploy  # Non-root user for Docker operations
  # Note: root access should use become: true in playbooks, not persistent group membership

# Traefik settings
traefik_version: "v3.6.1"
traefik_dashboard_enabled: false
traefik_dashboard_auth: true
traefik_acme_email: "diadon@conscious.energy"
traefik_acme_staging: false  # Set to true for testing

# Database settings
postgres_version: "16"
postgres_db: "lenr_sim"
postgres_user: "lenr_app"
# postgres_password: Set via environment variable or vault

# FastAPI settings
fastapi_workers: 4
fastapi_log_level: "info"
fastapi_replicas: 2

# Security settings
ufw_allowed_ports:
  - 22   # SSH
  - 80   # HTTP (for Let's Encrypt)
  - 443  # HTTPS

fail2ban_enabled: true
fail2ban_sshd_maxretry: 3
fail2ban_sshd_bantime: 24h

# Backup settings
backup_enabled: true
backup_retention_days: 7
backup_schedule: "0 3 * * *"  # Daily at 3 AM

# Monitoring / observability (see docs/v0.3.8-beta/OBSERVABILITY_GRAFANA.md)
# Stack services live in templates/docker-stack.yml.j2 when observability_enabled.
# Placement constraints use separate Swarm labels: app=true, observability=true
# (applied by playbooks/join-workers.yml from inventory swarm_node_labels).
health_check_interval: 30
health_check_timeout: 10
health_check_retries: 3
observability_enabled: true
# Set true after node labels exist (prod / multi-node). Staging single-node: false.
require_app_label: false
require_observability_label: false
grafana_admin_user: admin
grafana_traefik_enabled: false
grafana_subdomain: grafana-staging

# GHCR pull auth for Swarm stack deploy (--with-registry-auth).
# Prefer Ansible Vault or -e @secrets.yml — never commit real tokens.
# ghcr_username: consciousenergy
# ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
ghcr_username: "{{ lookup('env', 'GHCR_USER') | default('', true) }}"
ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') | default('', true) }}"
