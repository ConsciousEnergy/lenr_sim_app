server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Intentionally omit X-Frame-Options: SAMEORIGIN/DENY would block WordPress at
    # conscious.energy / www from iframes; CSP frame-ancestors is the allowlist.
    # Traefik spa-security-headers must keep frameDeny: false (live SEC-01 drift).
    # Repeat add_header in every location that sets Cache-Control (nginx inheritance).
    set $spa_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://conscious.energy https://www.conscious.energy; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.conscious.energy https://us.i.posthog.com wss: https://lenr-sim-beta.conscious.energy https://app.conscious.energy; worker-src 'self' blob:; form-action 'self'";

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $spa_csp always;
    # Canary for post-apply probes (must appear without X-Frame-Options).
    add_header X-Frame-Policy "csp-frame-ancestors" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $spa_csp always;
        add_header X-Frame-Policy "csp-frame-ancestors" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $spa_csp always;
        add_header X-Frame-Policy "csp-frame-ancestors" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $spa_csp always;
        add_header X-Frame-Policy "csp-frame-ancestors" always;
        try_files $uri $uri/ /index.html;
    }
}
