name: lenr-ci smoke

# Hard-pinned to lenr-ci labels (no ubuntu-latest fallback).
# Proves self-hosted after registration — does not consume GitHub-hosted minutes.
# Deploy workflows must never use this runner.
# See docs/v0.3.7-beta/SELF_HOSTED_RUNNER.md
on:
  workflow_dispatch:
  # Also allow push/PR so proof jobs can land on self-hosted without Actions
  # admin rights to dispatch from the agent token.
  push:
    paths:
      - ".github/workflows/lenr-ci-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/lenr-ci-smoke.yml"
permissions:
  contents: read

concurrency:
  group: lenr-ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: lenr-ci runner smoke
    # Hard-pinned self-hosted: never run untrusted fork PR code on lenr-ci.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, lenr-ci]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prove labels and host identity
        env:
          # Repo var must be explicitly "1" for intentional share co-tenant CI.
          # Interim lenr-ci-share-* names alone are NOT enough — goal evidence
          # requires a dedicated Hostinger VM ≠ 185.211.4.66.
          LENR_CI_ALLOW_SHARE: ${{ vars.LENR_CI_ALLOW_SHARE }}
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_name=${RUNNER_NAME:-}"
          echo "runner_os=${RUNNER_OS:-}"
          echo "runner_arch=${RUNNER_ARCH:-}"
          hostname -f || hostname
          ON_SHARE=0
          if ip -4 addr 2>/dev/null | grep -q '185\.211\.4\.66'; then
            ON_SHARE=1
          fi
          # Dedicated-VM mode (default): refuse Compose share. Green smoke must
          # mean dedicated placement — not interim co-tenant on beta host.
          if [[ "$ON_SHARE" -eq 1 ]]; then
            if [[ "${LENR_CI_ALLOW_SHARE:-}" == "1" ]]; then
              echo "Share co-tenant allowed via vars.LENR_CI_ALLOW_SHARE=1 (name=${RUNNER_NAME:-})."
            else
              echo "::error::Refuse: smoke on Compose share 185.211.4.66. Dedicated CI VM required (complete Hostinger 3DS). Set repo var LENR_CI_ALLOW_SHARE=1 only for intentional interim co-tenant."
              exit 2
            fi
          fi
          # Derive EXPECTED from repo markers (same four surfaces as test.yml
          # version-consistency). Do not hard-pin a train string here — that
          # stale-pin pattern failed tip/v0.3.9-beta when markers moved past
          # 0.3.7-beta (e.g. actions run 41724267828).
          EXPECTED=$(grep -oP 'APP_VERSION: str = "\K[^"]+' LENR_SIM_APP_v2/backend/app/core/config.py)
          if [[ -z "$EXPECTED" ]]; then
            echo "::error file=LENR_SIM_APP_v2/backend/app/core/config.py::APP_VERSION marker not found"
            exit 1
          fi
          FRONT_PKG=$(jq -r '.version' LENR_SIM_APP_v2/frontend/package.json)
          FRONT_CFG=$(grep -oP "APP_VERSION = '\K[^']+" LENR_SIM_APP_v2/frontend/src/config/version.js)
          DOCKER_VER=$(grep -oP 'BUILD_VERSION=\K[^\s]+' LENR_SIM_APP_v2/infrastructure/docker/Dockerfile.backend)
          FAIL=0
          for pair in "frontend/package.json:${FRONT_PKG}" "frontend/config/version.js:${FRONT_CFG}" "Dockerfile.backend:${DOCKER_VER}"; do
            name="${pair%%:*}"
            val="${pair##*:}"
            if [[ "$val" != "$EXPECTED" ]]; then
              echo "::error file=${name}::expected ${EXPECTED} but found ${val}"
              FAIL=1
            fi
          done
          if [[ "$FAIL" -ne 0 ]]; then
            exit 1
          fi
          echo "version-consistency smoke: $EXPECTED OK"
          echo "## lenr-ci smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- host: $(hostname)" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${EXPECTED}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ON_SHARE" -eq 1 ]]; then
            echo "- placement: Compose share KVM2 (LENR_CI_ALLOW_SHARE=1 interim)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- placement: dedicated CI VM (not 185.211.4.66)" >> "$GITHUB_STEP_SUMMARY"
          fi
