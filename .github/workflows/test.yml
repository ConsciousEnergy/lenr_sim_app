name: Test and Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, '3.10']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-cov pytest-benchmark memory_profiler psutil matplotlib numpy scipy

    - name: Run unit tests
      run: |
        cd backend
        python -m pytest tests/ --cov=app --cov-report=xml -v

    - name: Run integration tests
      run: |
        cd backend
        python -m pytest tests/integration/ -v

    - name: Run performance benchmarks
      run: |
        cd backend
        python -m pytest tests/performance/ --benchmark-only -v

    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        fail_ci_if_error: true

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: |
          backend/benchmarks/
          backend/tests/performance/*.png
        retention-days: 90

  analyze-benchmarks:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v3

    - name: Download previous benchmark results
      uses: actions/download-artifact@v3
      with:
        name: benchmark-results
        path: previous-benchmarks

    - name: Compare benchmark results
      run: |
        python backend/scripts/compare_benchmarks.py \
          --previous previous-benchmarks \
          --current backend/benchmarks \
          --threshold 10

    - name: Comment benchmark comparison
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const comparison = fs.readFileSync('benchmark-comparison.md', 'utf8');
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comparison
          }); 