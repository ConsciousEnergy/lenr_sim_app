name: Test and Benchmark

# Trunk-based model (see .github/BRANCHING.md): main is the only long-lived
# branch, so CI runs on pushes to main and on every PR targeting main.
#
# Runner: set repo variable LENR_CI_RUNS_ON to
#   ["self-hosted","linux","x64","lenr-ci"]
# after the dedicated CI VM is Idle. Leave unset to keep ubuntu-latest
# (avoids forever-queue). See docs/v0.3.7-beta/SELF_HOSTED_RUNNER.md.
# Deploy/ship stays on GitHub-hosted — never mix VPS_* with lenr-ci PR jobs.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR/branch to save minutes.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-consistency:
    # Fail fast on mixed version markers across runtime surfaces.
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version consistency
        shell: bash
        run: |
          EXPECTED=$(grep -oP 'APP_VERSION: str = "\K[^"]+' LENR_SIM_APP_v2/backend/app/core/config.py)
          echo "Expected version: ${EXPECTED}"
          FAIL=0
          FRONT_PKG=$(jq -r '.version' LENR_SIM_APP_v2/frontend/package.json)
          FRONT_CFG=$(grep -oP "APP_VERSION = '\K[^']+" LENR_SIM_APP_v2/frontend/src/config/version.js)
          DOCKER_VER=$(grep -oP 'BUILD_VERSION=\K[^\s]+' LENR_SIM_APP_v2/infrastructure/docker/Dockerfile.backend)
          for pair in "frontend/package.json:${FRONT_PKG}" "frontend/config/version.js:${FRONT_CFG}" "Dockerfile.backend:${DOCKER_VER}"; do
            name="${pair%%:*}"
            val="${pair##*:}"
            if [ "$val" != "$EXPECTED" ]; then
              echo "::error file=${name}::expected ${EXPECTED} but found ${val}"
              FAIL=1
            fi
          done
          exit $FAIL

  detect-changes:
    # Path filters: docs/academic-only PRs skip heavy jobs so parallel academic
    # review stays cheap. Push/main and workflow_dispatch always run all.
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      formalization: ${{ steps.filter.outputs.formalization }}
      infra: ${{ steps.filter.outputs.infra }}
      run_all: ${{ steps.filter.outputs.run_all }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          set_all_true() {
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "formalization=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
          }
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            set_all_true
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t FILES < <(git diff --name-only "$BASE"..."$HEAD")
          if [ "${#FILES[@]}" -eq 0 ]; then
            set_all_true
            exit 0
          fi
          backend=false
          frontend=false
          formalization=false
          infra=false
          for f in "${FILES[@]}"; do
            case "$f" in
              LENR_SIM_APP_v2/backend/*|LENR_SIM_APP_v2/backend) backend=true ;;
            esac
            case "$f" in
              LENR_SIM_APP_v2/frontend/*|LENR_SIM_APP_v2/frontend) frontend=true ;;
            esac
            case "$f" in
              formalization/*|docs/FORMALIZATION/*|LENR_SIM_APP_v2/docs/FORMALIZATION/*) formalization=true ;;
            esac
            case "$f" in
              LENR_SIM_APP_v2/infrastructure/*|.github/workflows/*|.github/workflows) infra=true ;;
            esac
            # Workflow or lockfile changes must still exercise relevant gates.
            case "$f" in
              .github/workflows/test.yml|LENR_SIM_APP_v2/backend/requirements*.txt|LENR_SIM_APP_v2/frontend/package-lock.json)
                backend=true
                frontend=true
                ;;
            esac
          done
          echo "run_all=false" >> "$GITHUB_OUTPUT"
          echo "backend=${backend}" >> "$GITHUB_OUTPUT"
          echo "frontend=${frontend}" >> "$GITHUB_OUTPUT"
          echo "formalization=${formalization}" >> "$GITHUB_OUTPUT"
          echo "infra=${infra}" >> "$GITHUB_OUTPUT"
          {
            echo "Changed files (${#FILES[@]}):"
            printf '%s\n' "${FILES[@]}"
            echo "backend=${backend} frontend=${frontend} formalization=${formalization} infra=${infra}"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [version-consistency, detect-changes]
    if: needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
    strategy:
      matrix:
        # PRs: 3.12 only (matches Dockerfile.backend). Push/main + dispatch:
        # keep 3.10/3.11 for the documented minimum-supported range.
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.12"]') || fromJSON('["3.10", "3.11", "3.12"]') }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r LENR_SIM_APP_v2/backend/requirements.txt
        pip install pytest pytest-cov pytest-benchmark memory_profiler psutil matplotlib numpy scipy pip-audit

    - name: Backend dependency audit
      # Residual-risk policy: fail on any new/fixable advisory, but tolerate the
      # documented, out-of-beta-scope transitive residuals below (see
      # docs/v0.3.6-beta/SECURITY_CI_HARDENING.md for rationale + tracking):
      #   starlette PYSEC-2026-161/248/249/2280/2281  - fix only in 1.x, blocked by fastapi<0.51 pin
      #   vtk       PYSEC-2025-224/225/226            - transitive via pyvista
      #   ecdsa     PYSEC-2026-1325                   - transitive via python-jose, no upstream fix
      run: |
        cd LENR_SIM_APP_v2/backend
        pip-audit -r requirements.txt \
          --ignore-vuln PYSEC-2026-161 \
          --ignore-vuln PYSEC-2026-248 \
          --ignore-vuln PYSEC-2026-249 \
          --ignore-vuln PYSEC-2026-2280 \
          --ignore-vuln PYSEC-2026-2281 \
          --ignore-vuln PYSEC-2025-224 \
          --ignore-vuln PYSEC-2025-225 \
          --ignore-vuln PYSEC-2025-226 \
          --ignore-vuln PYSEC-2026-1325

    - name: Run unit tests
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/ app/tests/ --cov=app --cov-report=xml -v

    - name: Run integration tests
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/test_integration/ -v

    - name: Run deterministic V&V benchmark gates
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/test_integration/test_physics_benchmark_gates.py -v

    - name: Run experiment-anchored science gates (release-blocking)
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest -v \
          tests/test_integration/test_experiment_anchored_gates.py \
          tests/test_integration/test_rate_engine_api.py \
          tests/test_physics/test_reaction_rate_engine.py \
          tests/test_physics/test_cavitation_kgrp.py \
          tests/test_physics/test_shell_pairing_prior.py \
          tests/test_physics/test_run_export.py

    - name: Run performance benchmarks
      if: hashFiles('LENR_SIM_APP_v2/backend/tests/performance/*.py') != ''
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/performance/ --benchmark-only -v

    - name: Upload coverage report
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        # codecov-action v7+ accepts `files` (plural); `file` is ignored and warns.
        files: ./LENR_SIM_APP_v2/backend/coverage.xml
        fail_ci_if_error: false

    - name: Upload benchmark results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results-${{ matrix.python-version }}
        path: |
          LENR_SIM_APP_v2/backend/benchmarks/
          LENR_SIM_APP_v2/backend/tests/performance/*.png
        if-no-files-found: ignore
        retention-days: 90

  frontend:
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [version-consistency, detect-changes]
    if: needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: LENR_SIM_APP_v2/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm ci

      - name: Security gate (high and critical)
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm audit --audit-level=high

      - name: Lint frontend
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm run lint

      - name: Test frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm test

      - name: Build frontend
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm run build

  frontend-e2e:
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [version-consistency, detect-changes]
    if: needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: LENR_SIM_APP_v2/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd LENR_SIM_APP_v2/frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright (Chromium)
        working-directory: LENR_SIM_APP_v2/frontend
        env:
          CI: true
        run: npm run e2e

  formalization:
    # Equation IR + Lean 4 consistency pilot (sibling to Wolfram/pytest science gates).
    # Does NOT claim LENR is proven — only mathematical consistency of adopted THM/DEF core.
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [version-consistency, detect-changes]
    if: needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.formalization == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check equation IR
        run: python formalization/scripts/check_ir.py

      - name: Diff IR literals vs Python
        run: python formalization/scripts/diff_code_literals.py

      - name: Install elan / Lean toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build LenrFormal
        working-directory: formalization/lean
        run: lake build

      - name: No sorry in LenrFormal
        # Matches `sorry` used as a proof term (`:= sorry`, `by sorry`, `exact sorry`,
        # or on its own tactic line); the word inside prose comments does not trip it.
        run: |
          ! grep -rnE '(^\s*(·\s*)?|:=\s*|\bby\s+|\bexact\s+)sorry\b' \
            formalization/lean/LenrFormal --include='*.lean'

  compose-config:
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [version-consistency, detect-changes]
    if: needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.infra == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate production compose file
        run: |
          docker compose \
            --env-file LENR_SIM_APP_v2/infrastructure/vps/.env.production.example \
            -f LENR_SIM_APP_v2/infrastructure/vps/docker-compose.prod.yml \
            config -q

  # Track C (v0.3.8): keep staging Swarm dry-run gates + terraform/ansible
  # syntax valid on every infra-touching PR. Remote plan/check stays operator-credentialed.
  staging-swarm-dry-run:
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["ubuntu-latest"]') }}
    needs: [version-consistency, detect-changes]
    if: needs.detect-changes.outputs.run_all == 'true' || needs.detect-changes.outputs.infra == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Local staging dry-run (confirm gates + validate + syntax-check)
        env:
          STAGING_EVIDENCE_DIR: ${{ runner.temp }}/staging-evidence
        run: |
          mkdir -p "$STAGING_EVIDENCE_DIR"
          ./LENR_SIM_APP_v2/infrastructure/scripts/staging-swarm-dry-run.sh local

      - name: Upload staging dry-run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-swarm-local-dry-run
          path: ${{ runner.temp }}/staging-evidence/
          if-no-files-found: warn
