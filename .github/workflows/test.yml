name: Test and Benchmark

on:
  push:
    branches: [ main, lenr_sim_app_v0.3.0-beta, lenr_sim_app_v0.3.5-beta ]
  pull_request:
    branches: [ main, lenr_sim_app_v0.3.0-beta, lenr_sim_app_v0.3.5-beta ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r LENR_SIM_APP_v2/backend/requirements.txt
        pip install pytest pytest-cov pytest-benchmark memory_profiler psutil matplotlib numpy scipy

    - name: Run unit tests
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/ app/tests/ --cov=app --cov-report=xml -v

    - name: Run integration tests
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/test_integration/ -v

    - name: Run performance benchmarks
      if: hashFiles('LENR_SIM_APP_v2/backend/tests/performance/*.py') != ''
      run: |
        cd LENR_SIM_APP_v2/backend
        python -m pytest tests/performance/ --benchmark-only -v

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      with:
        file: ./LENR_SIM_APP_v2/backend/coverage.xml
        fail_ci_if_error: false

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          LENR_SIM_APP_v2/backend/benchmarks/
          LENR_SIM_APP_v2/backend/tests/performance/*.png
        if-no-files-found: ignore
        retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: LENR_SIM_APP_v2/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm ci

      - name: Lint frontend
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm run lint

      - name: Test frontend
        env:
          # Stabilize Jest execution in CI and avoid worker memory spikes.
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm test -- --watchAll=false --passWithNoTests --runInBand

      - name: Build frontend
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm run build