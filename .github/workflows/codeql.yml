name: CodeQL

# Static analysis for the FastAPI backend (Python) and the React/Vite frontend
# (JavaScript/TypeScript). Results appear under Security -> Code scanning.
#
# GitHub code scanning is only available on public repositories or private
# repositories with GitHub Advanced Security. The job is therefore gated on
# repository visibility so it is a no-op until the repository is public (or
# GHAS is enabled), instead of failing every PR with "Advanced Security must
# be enabled". Remove the `if:` once one of those is true.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly, Tuesdays 06:00 UTC (offset from the Monday dependency scans).
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    # Default: lenr-ci self-hosted. Override via LENR_CI_RUNS_ON if needed.
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["self-hosted","linux","x64","lenr-ci"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # Only the shipped application is analyzed; archived reports and
          # the Lean formalization pilot are out of scope.
          config: |
            paths:
              - LENR_SIM_APP_v2/backend/app
              - LENR_SIM_APP_v2/frontend/src
            paths-ignore:
              - '**/node_modules/**'
              - '**/dist/**'
              - '**/*.test.js'
              - '**/*.test.jsx'
              - '**/*.test.ts'
              - '**/*.test.tsx'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
