name: Build and Deploy

on:
  push:
    branches: [main, lenr_sim_app_v0.3.6-beta]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase GHCR owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/lenr-sim-backend
          tags: |
            type=raw,value=0.3.6-beta
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./LENR_SIM_APP_v2
          file: ./LENR_SIM_APP_v2/infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=0.3.6-beta
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LENR_SIM_APP_v2/frontend/package-lock.json

      - name: Install dependencies
        working-directory: LENR_SIM_APP_v2/frontend
        run: npm ci

      - name: Build frontend
        working-directory: LENR_SIM_APP_v2/frontend
        env:
          VITE_API_URL: same-origin
          REACT_APP_API_URL: same-origin
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: LENR_SIM_APP_v2/frontend/dist/
          retention-days: 7

  build-frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase GHCR owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/lenr-sim-frontend
          tags: |
            type=raw,value=0.3.6-beta
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./LENR_SIM_APP_v2
          file: ./LENR_SIM_APP_v2/infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=same-origin
            REACT_APP_API_URL=same-origin
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    # Manual only. Promote to push-on-ship-branch after two clean runs.
    if: github.event_name == 'workflow_dispatch'
    needs: [build-backend, build-frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "VPS_HOST / VPS_SSH_KEY secrets are not set; skipping live deploy."
            exit 1
          fi
          umask 077
          KEY=$(mktemp)
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "root@${VPS_HOST}" \
            'set -euo pipefail
             cd /opt/lenr-sim/src
             git fetch origin
             git checkout -q "$(git rev-parse --abbrev-ref HEAD)"
             git pull --ff-only
             LENR_ENV_FILE=/opt/lenr-sim/.env \
               LENR_SIM_APP_v2/infrastructure/vps/scripts/deploy.sh'
          rm -f "$KEY"

