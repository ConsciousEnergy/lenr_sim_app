name: Build and Deploy

# Trunk-based model (see .github/BRANCHING.md): images are built from main and
# from release tags. The image version tag and BUILD_VERSION are read from the
# canonical APP_VERSION marker so they can never drift from the code.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Agent/CI tokens often lack workflow_dispatch; contents:write can still
  # repository_dispatch. Require client_payload.confirm == I_SHIP_VPS_0_3_8.
  repository_dispatch:
    # vps-compose-ship: rebuild images + deploy (full path).
    # vps-compose-redeploy: deploy-only using existing GHCR tags (cheap; for
    # when Actions VPS_* secrets appear after images are already on GHCR).
    types: [vps-compose-ship, vps-compose-redeploy]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-backend:
    if: github.event_name != 'repository_dispatch' || github.event.action != 'vps-compose-redeploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read APP_VERSION
        id: version
        shell: bash
        run: |
          APP_VERSION=$(grep -oP 'APP_VERSION: str = "\K[^"]+' LENR_SIM_APP_v2/backend/app/core/config.py)
          if [ -z "$APP_VERSION" ]; then
            echo "::error file=LENR_SIM_APP_v2/backend/app/core/config.py::APP_VERSION marker not found"
            exit 1
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${APP_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase GHCR owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/lenr-sim-backend
          tags: |
            type=raw,value=${{ steps.version.outputs.app_version }}
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./LENR_SIM_APP_v2
          file: ./LENR_SIM_APP_v2/infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    if: github.event_name != 'repository_dispatch' || github.event.action != 'vps-compose-redeploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LENR_SIM_APP_v2/frontend/package-lock.json

      - name: Install dependencies
        working-directory: LENR_SIM_APP_v2/frontend
        run: npm ci

      - name: Build frontend
        working-directory: LENR_SIM_APP_v2/frontend
        env:
          VITE_API_URL: same-origin
          REACT_APP_API_URL: same-origin
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: LENR_SIM_APP_v2/frontend/dist/
          retention-days: 7

  build-frontend-image:
    if: github.event_name != 'repository_dispatch' || github.event.action != 'vps-compose-redeploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read APP_VERSION
        id: version
        shell: bash
        run: |
          APP_VERSION=$(grep -oP 'APP_VERSION: str = "\K[^"]+' LENR_SIM_APP_v2/backend/app/core/config.py)
          if [ -z "$APP_VERSION" ]; then
            echo "::error file=LENR_SIM_APP_v2/backend/app/core/config.py::APP_VERSION marker not found"
            exit 1
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase GHCR owner
        id: image
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/lenr-sim-frontend
          tags: |
            type=raw,value=${{ steps.version.outputs.app_version }}
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./LENR_SIM_APP_v2
          file: ./LENR_SIM_APP_v2/infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=same-origin
            REACT_APP_API_URL=same-origin
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    # Manual / gated ship only — never on bare push to main.
    # Prefer workflow_dispatch; repository_dispatch type vps-compose-ship is the
    # fallback when the caller cannot create workflow_dispatch events.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'vps-compose-ship')
    needs: [build-backend, build-frontend-image]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (APP_VERSION + share verify)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate repository_dispatch confirm
        if: github.event_name == 'repository_dispatch'
        env:
          CONFIRM: ${{ github.event.client_payload.confirm }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM:-}" != "I_SHIP_VPS_0_3_8" ]]; then
            echo "::error::refuse vps-compose-ship without client_payload.confirm=I_SHIP_VPS_0_3_8"
            exit 2
          fi
          echo "OK: repository_dispatch confirm accepted"

      - name: Read APP_VERSION
        id: version
        shell: bash
        run: |
          APP_VERSION=$(grep -oP 'APP_VERSION: str = "\K[^"]+' LENR_SIM_APP_v2/backend/app/core/config.py)
          if [ -z "$APP_VERSION" ]; then
            echo "::error file=LENR_SIM_APP_v2/backend/app/core/config.py::APP_VERSION marker not found"
            exit 1
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Deploying IMAGE_TAG=${APP_VERSION}"

      - name: SSH deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          IMAGE_TAG: ${{ steps.version.outputs.app_version }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "VPS_HOST / VPS_SSH_KEY secrets are not set; skipping live deploy."
            exit 1
          fi
          umask 077
          KEY=$(mktemp)
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY"
          # Pin VPS checkout to the workflow SHA that built GHCR images, and force
          # tip APP_VERSION into .env so neither scripts/Caddyfile nor IMAGE_TAG
          # can lag a 0.3.7 tip deploy (stale branch + IMAGE_TAG=0.3.6-beta).
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "root@${VPS_HOST}" \
            "set -euo pipefail
             cd /opt/lenr-sim/src
             git fetch --prune origin
             if ! git cat-file -e '${DEPLOY_SHA}^{commit}' 2>/dev/null; then
               git fetch origin '${DEPLOY_SHA}'
             fi
             git checkout -qf '${DEPLOY_SHA}'
             echo \"VPS HEAD=\$(git rev-parse --short HEAD) (pinned to workflow SHA)\"
             LENR_ENV_FILE=/opt/lenr-sim/.env \
               IMAGE_TAG='${IMAGE_TAG}' \
               UPDATE_ENV_IMAGE_TAG=1 \
               EXPECT_VERSION='${IMAGE_TAG}' \
               LENR_SIM_APP_v2/infrastructure/vps/scripts/deploy.sh"
          rm -f "$KEY"

      - name: Verify public share health
        env:
          BETA_SHARE_URL: ${{ vars.BETA_SHARE_URL }}
          EXPECT_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          chmod +x LENR_SIM_APP_v2/infrastructure/vps/scripts/verify-beta-share.sh
          export BETA_SHARE_URL="${BETA_SHARE_URL:-https://lenr-sim-beta.conscious.energy}"
          export EXPECT_VERSION
          echo "Expecting share host version: ${EXPECT_VERSION}"
          LENR_SIM_APP_v2/infrastructure/vps/scripts/verify-beta-share.sh

  # Cheap path: pull existing GHCR tags to VPS without rebuilding images.
  # Trigger: repository_dispatch type vps-compose-redeploy + confirm token.
  # Requires Actions secrets VPS_HOST + VPS_SSH_KEY (same as deploy-vps).
  deploy-vps-redeploy:
    if: >
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'vps-compose-redeploy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (APP_VERSION + share verify)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate repository_dispatch confirm
        env:
          CONFIRM: ${{ github.event.client_payload.confirm }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM:-}" != "I_SHIP_VPS_0_3_8" ]]; then
            echo "::error::refuse vps-compose-redeploy without client_payload.confirm=I_SHIP_VPS_0_3_8"
            exit 2
          fi
          echo "OK: repository_dispatch redeploy confirm accepted"

      - name: Read APP_VERSION
        id: version
        shell: bash
        run: |
          APP_VERSION=$(grep -oP 'APP_VERSION: str = "\K[^"]+' LENR_SIM_APP_v2/backend/app/core/config.py)
          if [ -z "$APP_VERSION" ]; then
            echo "::error file=LENR_SIM_APP_v2/backend/app/core/config.py::APP_VERSION marker not found"
            exit 1
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Redeploying IMAGE_TAG=${APP_VERSION} (no image rebuild)"

      - name: SSH deploy (existing GHCR tags)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          IMAGE_TAG: ${{ steps.version.outputs.app_version }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "VPS_HOST / VPS_SSH_KEY secrets are not set; skipping live deploy."
            exit 1
          fi
          umask 077
          KEY=$(mktemp)
          printf '%s\n' "$VPS_SSH_KEY" > "$KEY"
          ssh -i "$KEY" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "root@${VPS_HOST}" \
            "set -euo pipefail
             cd /opt/lenr-sim/src
             git fetch --prune origin
             if ! git cat-file -e '${DEPLOY_SHA}^{commit}' 2>/dev/null; then
               git fetch origin '${DEPLOY_SHA}'
             fi
             git checkout -qf '${DEPLOY_SHA}'
             echo \"VPS HEAD=\$(git rev-parse --short HEAD) (pinned to workflow SHA)\"
             LENR_ENV_FILE=/opt/lenr-sim/.env \
               IMAGE_TAG='${IMAGE_TAG}' \
               UPDATE_ENV_IMAGE_TAG=1 \
               EXPECT_VERSION='${IMAGE_TAG}' \
               LENR_SIM_APP_v2/infrastructure/vps/scripts/deploy.sh"
          rm -f "$KEY"

      - name: Verify public share health
        env:
          BETA_SHARE_URL: ${{ vars.BETA_SHARE_URL }}
          EXPECT_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          set -euo pipefail
          chmod +x LENR_SIM_APP_v2/infrastructure/vps/scripts/verify-beta-share.sh
          export BETA_SHARE_URL="${BETA_SHARE_URL:-https://lenr-sim-beta.conscious.energy}"
          export EXPECT_VERSION
          echo "Expecting share host version: ${EXPECT_VERSION}"
          LENR_SIM_APP_v2/infrastructure/vps/scripts/verify-beta-share.sh

