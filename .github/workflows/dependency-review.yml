name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - development
      - lenr_sim_app_v0.3.6-beta

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Prefer blocking on high/critical once Dependency graph + GHAS are
      # enabled (Settings → Code security and analysis). Until then the action
      # fails with "Dependency review is not supported on this repository", so
      # keep continue-on-error so PR checks stay green. See SECURITY_CI_HARDENING.md.
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
