name: Dependency Review

on:
  pull_request:
    branches:
      - main
      - lenr_sim_app_v0.3.6-beta

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    # Non-blocking: requires Dependency Graph + GHAS to be enabled in repo settings.
    # Remove continue-on-error once enabled at Settings > Code security and analysis.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
