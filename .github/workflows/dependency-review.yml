name: Dependency Review

# PRs targeting main (0.3.9-beta release/hotfix) or dev (0.3.9-beta integration).
on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Prefer lenr-ci (spend-limit on hosted). Override via LENR_CI_RUNS_ON if needed.
jobs:
  dependency-review:
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["self-hosted","linux","x64","lenr-ci"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prefer blocking on high/critical once Dependency graph + GHAS are
      # enabled (Settings → Code security and analysis). Until then the action
      # fails with "Dependency review is not supported on this repository", so
      # keep continue-on-error so PR checks stay green. See SECURITY_CI_HARDENING.md.
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
