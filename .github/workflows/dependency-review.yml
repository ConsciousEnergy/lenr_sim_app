name: Dependency Review

# Trunk-based model (see .github/BRANCHING.md): every PR targets main.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Prefer blocking on high/critical once Dependency graph + GHAS are
      # enabled (Settings → Code security and analysis). Until then the action
      # fails with "Dependency review is not supported on this repository", so
      # keep continue-on-error so PR checks stay green. See SECURITY_CI_HARDENING.md.
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
