name: Scheduled Security Scan

# Complements the push/PR audits in test.yml and the PR-only dependency-review:
# this runs on a cadence so newly-disclosed CVEs against ALREADY-committed
# dependencies are caught even when no code changes land. Also manually runnable.
# The secret scan additionally runs on every PR to main/dev so a leaked
# credential is caught before it is merged.

on:
  schedule:
    # Weekly, Mondays 13:00 UTC (aligns with the Dependabot Monday cadence).
    - cron: '0 13 * * 1'
  pull_request:
    branches: [main, dev]
    # Only the secret scan runs on PRs (see job-level `if`); the dependency
    # audits already run in test.yml for every PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default: lenr-ci self-hosted. Override via LENR_CI_RUNS_ON if needed.
# See docs/v0.3.7-beta/SELF_HOSTED_RUNNER.md. Deploy secrets never land here.
jobs:
  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["self-hosted","linux","x64","lenr-ci"]') }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so secrets committed in the past (not just the diff)
          # are detected.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tgz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt \
            | sed 's|gitleaks_.*_linux_x64.tar.gz|gitleaks.tgz|' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan repository history
        run: |
          set +e
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 \
            --report-format json --report-path gitleaks-report.json . > gitleaks.txt 2>&1
          code=$?
          {
            echo "## Secret scan (gitleaks v${GITLEAKS_VERSION})";
            echo '```';
            tail -n 20 gitleaks.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

      - name: Upload redacted report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14

  backend-audit:
    name: Backend pip-audit
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["self-hosted","linux","x64","lenr-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit backend requirements
        # Same ignore list as test.yml Backend dependency audit (SEC-015 alignment).
        # starlette 1.x + vtk via pyvista only; jose/ecdsa cleared by dropping unused deps.
        run: |
          cd LENR_SIM_APP_v2/backend
          set +e
          pip-audit -r requirements.txt --desc \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2025-224 \
            --ignore-vuln PYSEC-2025-225 \
            --ignore-vuln PYSEC-2025-226 \
            > audit.txt 2>&1
          code=$?
          {
            echo "## Backend pip-audit";
            echo '```';
            cat audit.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  frontend-audit:
    name: Frontend npm audit (high+)
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(vars.LENR_CI_RUNS_ON || '["self-hosted","linux","x64","lenr-ci"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: LENR_SIM_APP_v2/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd LENR_SIM_APP_v2/frontend
          npm ci

      - name: Audit frontend dependencies
        # Align with PR gate (audit-high-gate.js), not raw npm audit --audit-level=high.
        run: |
          cd LENR_SIM_APP_v2/frontend
          set +e
          node scripts/audit-high-gate.js > audit.txt 2>&1
          code=$?
          {
            echo "## Frontend npm audit (high and critical)";
            echo '```';
            cat audit.txt;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
