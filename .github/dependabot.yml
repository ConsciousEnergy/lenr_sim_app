# Dependabot configuration for the LENR Simulation App
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# GitHub reads this file from the default branch (main). Updates target `dev`
# (v0.3.8 integration) so weekly noise does not churn the 0.3.7 release line.
# See .github/BRANCHING.md.
#
# Minor/patch updates are grouped into one PR per ecosystem per week to keep
# the PR list short; majors stay as individual PRs (or are ignored below with
# a documented reason). Actions are SHA-pinned in the workflows; Dependabot
# updates the SHA and the trailing `# vX.Y.Z` comment together.
#
# Required repository labels (create in GitHub Settings → Labels or they are
# skipped with a Dependabot comment): dependencies, backend, frontend, ci, docker.
version: 2
updates:
  # Backend Python (FastAPI) dependencies
  - package-ecosystem: "pip"
    directory: "/LENR_SIM_APP_v2/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # Stay on pydantic v2 until an explicit v3 migration.
      - dependency-name: "pydantic"
        update-types:
          - "version-update:semver-major"
      # NumPy 2.5+ drops Python 3.11; CI push matrix is 3.11–3.12 (PRs 3.12).
      # The stack is also pinned to NumPy 1.26 to avoid hybrid 1/2 Windows breakage.
      - dependency-name: "numpy"
        update-types:
          - "version-update:semver-major"
      # SciPy 1.18+ requires Python >=3.12 and NumPy 2.x.
      - dependency-name: "scipy"
        update-types:
          - "version-update:semver-major"
      # websockets 17.x requires Python >=3.11; keep 14.x with FastAPI/uvicorn.
      - dependency-name: "websockets"
        update-types:
          - "version-update:semver-major"
      # Numba 0.67 pulls llvmlite 0.49; JIT is used in physics optimizations
      # with no dedicated import tests. Stay on 0.60 until a numba migration.
      - dependency-name: "numba"
        update-types:
          - "version-update:semver-major"
      # psutil 7 is a major used at process boot (app.main). Not a weekly bump.
      - dependency-name: "psutil"
        update-types:
          - "version-update:semver-major"
      # pandas 3 broke backend tests (#138). Stay on 2.2.x until a dedicated migration.
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"
      # uvicorn 0.52 is a 0.x jump vs fastapi==0.128.0 / starlette==0.49.1 /
      # websockets==14.2. Dependabot treats 0.30→0.52 as a minor; ignore both
      # until an explicit FastAPI/ASGI bump. Patches on 0.30.x still open.
      - dependency-name: "uvicorn"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # v8 requires starlette>=1; the app is pinned to starlette==0.49.1 /
      # fastapi==0.128.0. #148 failed pip install on 3.10–3.12.
      - dependency-name: "prometheus-fastapi-instrumentator"
        update-types:
          - "version-update:semver-major"
      # starlette 1.x requires fastapi>=0.51-era releases; the app is pinned to
      # fastapi==0.128.0 / starlette==0.49.1 (#155). Bump together, deliberately.
      - dependency-name: "starlette"
        update-types:
          - "version-update:semver-major"
      # plotly 7 is a chart-API major (#172). Stay on 5.x until a dedicated migration.
      - dependency-name: "plotly"
        update-types:
          - "version-update:semver-major"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies (Vite + React 18).
  - package-ecosystem: "npm"
    directory: "/LENR_SIM_APP_v2/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      mui:
        patterns:
          - "@mui/*"
          - "@emotion/*"
      react-three:
        patterns:
          - "@react-three/*"
          - "three"
          - "@types/three"
      testing:
        patterns:
          - "@testing-library/*"
          - "jest*"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 5/6/7 is a compiler migration; the app is still mostly JS.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # MUI 8/9 is a dedicated Grid/API migration, not a weekly bump.
      # MUI 9 drops path imports such as @mui/icons-material/HelpOutline.
      - dependency-name: "@mui/material"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@mui/icons-material"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      # Vite 8 switches to Rolldown and drops bundled esbuild transforms.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      # Jest 30 / RTL 16 / jest-dom 7 need a dedicated test-harness migration.
      - dependency-name: "@testing-library/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@testing-library/jest-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@testing-library/user-event"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "jest-environment-jsdom"
        update-types:
          - "version-update:semver-major"
      # eslint-config-react-app is ESLint 8; eslint 9/10 is a dedicated migration.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # CI Node is 22; @types/node 26 is a types-major, not a weekly bump.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # react-markdown 10 is a major (remark/rehype peer shift). Stay on 9.x.
      - dependency-name: "react-markdown"
        update-types:
          - "version-update:semver-major"
      # Tailwind 4 is a PostCSS / @tailwind rewrite. Stay on 3.x (#149).
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      # React Router 7 is a dedicated data-router migration. Stay on 6.x (#150).
      - dependency-name: "react-router-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-router"
        update-types:
          - "version-update:semver-major"
      # Recharts 3 is a chart-API major on Analytics / waterfall. Stay on 2.x (#152).
      - dependency-name: "recharts"
        update-types:
          - "version-update:semver-major"
      # cssnano 9 failed frontend CI (#167). Stay on 6.x until a dedicated PostCSS pass.
      - dependency-name: "cssnano"
        update-types:
          - "version-update:semver-major"
      # Babel 8 is a compiler major (#169). Stay on 7.x with the Jest toolchain.
      - dependency-name: "@babel/plugin-transform-react-jsx"
        update-types:
          - "version-update:semver-major"
      # React DOM majors must ship with a deliberate React bump (#168 failed e2e).
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      # R3F 9 / drei 10 require React 19; #191 white-screened Unified Theory 3D
      # with TypeError reading 'S' on React 18. Stay on fiber 8 / drei 9 until
      # a deliberate React 19 migration.
      - dependency-name: "@react-three/fiber"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@react-three/drei"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions workflow versions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Docker base image updates
  - package-ecosystem: "docker"
    directory: "/LENR_SIM_APP_v2/infrastructure/docker"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # Runtime majors need a deliberate image rebuild + smoke test (#165 proposed
      # python 3.12→3.14 and node 22→26). Stay on the CI/documented versions.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
