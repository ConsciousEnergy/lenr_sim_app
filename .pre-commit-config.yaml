# Local pre-commit hooks (optional but recommended). Install once with:
#   pip install pre-commit && pre-commit install
# Run on demand with:  pre-commit run --all-files
#
# These mirror the CI gates that most often fail late: leaked secrets, large
# binaries, and Python lint. Frontend lint runs through the project's own
# npm script so it uses the repo's ESLint config and node_modules.
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^LENR_SIM_APP_v2/infrastructure/
      - id: detect-private-key
      - id: end-of-file-fixer
        files: ^(\.github/|LENR_SIM_APP_v2/backend/app/|formalization/)
      - id: trailing-whitespace
        files: ^(\.github/|LENR_SIM_APP_v2/backend/app/|formalization/)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        files: ^LENR_SIM_APP_v2/backend/
        # The full ruff.toml ruleset has ~12.6k pre-existing findings (mostly
        # import order / pyupgrade). Until that debt is paid down, only block
        # on the classes that are real bugs: syntax errors, undefined names,
        # and invalid comparisons/`print >>` style mistakes.
        args:
          - "--config"
          - "LENR_SIM_APP_v2/backend/ruff.toml"
          - "--select"
          - "E9,F63,F7,F82"

  - repo: local
    hooks:
      - id: frontend-eslint
        name: frontend eslint (npm run lint)
        entry: bash -c 'cd LENR_SIM_APP_v2/frontend && npm run lint --silent'
        language: system
        files: ^LENR_SIM_APP_v2/frontend/src/.*\.(js|jsx|ts|tsx)$
        pass_filenames: false
